# Configuration template for the LivingAuthenticity Environment.
#
# HOW TO USE
# ----------
# 1. Copy this file next to itself and rename the copy to:
#
#        paths.local.yaml
#
# 2. Adjust the values in your paths.local.yaml for your machine.
#
# NOTES
# -----
# * This file is a committed template. It contains only generic,
#   portable suggestions and never real machine-specific values.
# * paths.local.yaml is ignored by git and must never be committed.
# * The repository-internal locations ("project", "logs" and
#   "prompts") are always derived automatically from the repository
#   root. Do not set them in this file or in paths.local.yaml.
#
# STAGING
# -------
# ``staging.root`` declares the single directory that may be used as a
# controlled-execution staging destination. It is an explicit, named
# exception: every location listed below remains guarded, and staging is
# still refused anywhere else, including arbitrary children of
# ``data.root`` and any other subdirectory of the declared staging root.
# Leave it unset (or empty) to authorize no staging location inside
# guarded persistent data at all.

data:
  root: "Q:/SyntheticMachineOnly/PrivateData"

models:
  bge_m3: "Q:/SyntheticMachineOnly/PrivateData/Models/Embedding_Model/BGE_M3"

vector_db:
  lancedb: "Q:/SyntheticMachineOnly/PrivateData/Database/Vector_Database"

memory:
  root: "Q:/SyntheticMachineOnly/PrivateData/Memory"

obsidian:
  vault: "Q:/SyntheticMachineOnly/PrivateData/Knowledge/Obsidian"

zotero:
  library: "Q:/SyntheticMachineOnly/PrivateData/Knowledge/Zotero"

exports:
  root: "Q:/SyntheticMachineOnly/PrivateData/Knowledge/Exports"

cache:
  root: "Q:/SyntheticMachineOnly/PrivateData/Database/Cache"

staging:
  # Portable placeholder. Set the real directory only in the
  # gitignored paths.local.yaml.
  root: "Q:/SyntheticMachineOnly/PrivateData/Knowledge/Staging"

audit:
  # Portable placeholder. Durable append-only traceability records.
  # Set the real directory only in the gitignored paths.local.yaml.
  # Leave unset/empty to keep audit records in memory only.
  root: "Q:/SyntheticMachineOnly/PrivateData/Knowledge/Audit"
  # Optional: independently selectable storage locations for the two
  # audit categories. Each must resolve INSIDE the audit root above.
  # Defaults when omitted: "<audit.root>/passed" and "<audit.root>/failed".
  # passed: "Q:/SyntheticMachineOnly/PrivateData/Knowledge/Audit/passed"
  # failed: "Q:/SyntheticMachineOnly/PrivateData/Knowledge/Audit/failed"
